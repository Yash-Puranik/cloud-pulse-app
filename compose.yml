services:
  cloud-pulse:
    build:
      context: .
      target: runner
    container_name: cloud-pulse-app
    image: cloud-pulse:local
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
          - cloud-network
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

networks:
  cloud-network:
    driver: bridge

